services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dphe
      POSTGRES_PASSWORD: dphe
      POSTGRES_DB: dphe_api_test
    ports:
      - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dphe -d dphe_api_test"]
      interval: 5s
      timeout: 5s
      retries: 12
