services:
  dphe-data-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dphe-data-api:latest
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://dphe:dphe@host.docker.internal:55432/dphe}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3333}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-3333}:${PORT:-3333}"
    restart: unless-stopped
