name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - postgres

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dphe
          POSTGRES_PASSWORD: dphe
          POSTGRES_DB: dphe_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dphe -d dphe_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://dphe:dphe@localhost:5432/dphe_api_test
      TEST_DATABASE_URL: postgresql://dphe:dphe@localhost:5432/dphe_api_test
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate OpenAPI specification
        run: npm run build:spec
